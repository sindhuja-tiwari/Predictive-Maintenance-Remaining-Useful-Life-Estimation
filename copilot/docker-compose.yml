# Copilot API + Neo4j knowledge graph. From the repo root:
#   export ANTHROPIC_API_KEY=...   # optional; or GEMINI_API_KEY / OPENAI_API_KEY
#   export NEO4J_PASSWORD=...      # choose one; required
#   docker compose -f copilot/docker-compose.yml up --build
#   docker compose -f copilot/docker-compose.yml exec copilot python -m copilot.graph_kg
services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 12
    volumes:
      - neo4j-data:/data

  copilot:
    build:
      context: ..
      dockerfile: copilot/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
    ports:
      - "8100:8100"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
